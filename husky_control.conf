# Clearpath Twist Mux external input topic for the Husky vehicle bridge.
# Use an absolute topic so the robot namespace does not change the default.
HUSKY_CMD_VEL_TOPIC="${HUSKY_CMD_VEL_TOPIC:-/cmd_vel}"
HUSKY_ROBOT_NAMESPACE="${HUSKY_ROBOT_NAMESPACE:-/husky}"
# Leave physical command publication disabled until a real-robot session opts in.
HUSKY_ALLOW_PLATFORM_OUTPUT="${HUSKY_ALLOW_PLATFORM_OUTPUT:-false}"
