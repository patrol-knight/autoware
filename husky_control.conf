HUSKY_ROBOT_NAMESPACE="${HUSKY_ROBOT_NAMESPACE:-/husky}"
# Match the Husky driver and remote joystick DDS implementation by default.
HUSKY_RMW_IMPLEMENTATION="${HUSKY_RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}"
# Clearpath twist_mux subscribes to cmd_vel inside the robot namespace;
# it publishes the selected command to platform/cmd_vel_unstamped.
HUSKY_CMD_VEL_TOPIC="${HUSKY_CMD_VEL_TOPIC:-${HUSKY_ROBOT_NAMESPACE%/}/cmd_vel}"
# Leave physical command publication disabled until a real-robot session opts in.
HUSKY_ALLOW_PLATFORM_OUTPUT="${HUSKY_ALLOW_PLATFORM_OUTPUT:-false}"
